name: "Android UX infantil: capturas dia y noche"
on:
  push:
    branches:
      - supervisor/infantil-paisajes-victoria-20261120
    paths:
      - "app/**"
      - "tools/qa_storybook_android.py"
      - ".github/workflows/android-storybook-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android candidate
        run: ./gradlew :app:assembleDebug
      - name: Launch 320x640 Android emulator and capture UX
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 tools/qa_storybook_android.py
      - name: Upload screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-storybook-day-night-320x640
          path: docs/qa/emulator-storybook-20261120/
          if-no-files-found: warn
          retention-days: 14
