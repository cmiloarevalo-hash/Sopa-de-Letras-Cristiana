name: CI

on:
  push:
    branches: [main, 'implementer/a5-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Produce the debug APK before exhaustive test/QA phases, per A5 plan.
      # This is a technical build artifact until human visual review and
      # independent Supervisor acceptance of the exact source SHA.
      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Record APK identity
        run: python3 tools/check_apk_candidate.py

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-integration-review
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Validate word banks
        run: python3 tools/validate_words.py

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
