name: SopaBibliaIOS
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: cl.apkcristiana.sopadeletras
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SopaBibliaIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SopaBibliaIOS
      - path: campaign
        type: folder
        buildPhase: resources
      - path: rv1909
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: SopaBibliaIOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: SopaBibliaIOS
    scheme:
      gatherCoverageData: false

  SopaBibliaIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SopaBibliaIOSUITests
    dependencies:
      - target: SopaBibliaIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
